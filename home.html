<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            text-align: center;
            animation: fadeIn 2s ease-in-out, pulse 3s infinite alternate;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4; }
            100% { text-shadow: 0 0 20px #fff, 0 0 40px #ff1493; }
        }

        .btn-proximo {
            margin-top: 30px;
            padding: 12px 30px;
            font-size: 1.1rem;
            color: #fff;
            background-color: #ff1493;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px #fff, 0 0 20px #ff69b4;
            position: relative;
            z-index: 10;
        }

        .btn-proximo:hover {
            background-color: #ff69b4;
            transform: scale(1.1);
            box-shadow: 0 0 20px #fff, 0 0 40px #ff1493;
        }

        .heart {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none; /* NÃO bloqueia o clique */
        }

        .heart::before, .heart::after {
            content: "💖";
            position: absolute;
            font-size: 2rem;
            animation: float 6s infinite ease-in-out;
        }

        .heart::before {
            left: 20%;
            animation-delay: 0s;
        }

        .heart::after {
            left: 70%;
            animation-delay: 3s;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>

<body>
    <div>
        <h1>Oi mozão, bem-vinda! 💕<br>Está pronta para uma aventura?</h1>

        <button class="btn-proximo" onclick="window.location.href='login.html'">
            Próximo
        </button>
    </div>

    <div class="heart"></div>
</body>
</html>
