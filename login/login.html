<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="/Namoro/login/style.css">
</head>
<body>

    <main class="container">
        <h2>Bem-vinda, Leticia Ferreira!</h2>
        <img src="/Namoro/login/imagens/oioi.png" alt="Us" width="80" height="80" class="img-log">

        <form action="">
            <div class="inputs">
                <input type="password" id="password" placeholder="Password">
                <div class="underline"></div>
            </div>

            <input type="submit" onclick="log(); return false">
            <div class="dica">Dica: data do nosso primeiro encontro (dd/mm).</div>
        </form>
    </main>

    <script>
        function log(){
            var senha = document.getElementById('password').value;

            if(senha == "17/04"){
                alert('Parabéns amr!');
                location.href = "/Namoro/home/home.html";
            }else{
                alert('Pensa mais um pouco!');
            }
        }
    </script>

</body>
</html>
